plugins {
    id 'com.android.application'
}

// ============================================================================
//  CONFIGURE THIS: replace YOUR_LAPTOP_IP with your laptop's IPv4 address,
//  e.g. "http://192.168.1.25:8000/"   (must end with a slash, must NOT be
//  localhost / 127.0.0.1 because the phone is a different device).
// ============================================================================
def backendBaseUrl = "http://YOUR_LAPTOP_IP:8000/"

android {
    namespace 'com.example.nfcemployeewelcome'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.nfcemployeewelcome"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "BASE_URL", "\"${backendBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
